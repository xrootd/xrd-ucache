# CI: build+unit, coverage gate, ASan/UBSan, TSan, crash suite, per-PR
# differential fuzz, zero-admin clean-install; nightly long fuzz + crash loop.
# NOTE: the same gates are mirrored by a local pre-push runner.
name: ci
on:
  push: {branches: [main]}
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly: long fuzz + full crash loop

jobs:
  build-unit:
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, cc: gcc, cxx: g++, type: Release}
          - {os: ubuntu-24.04, cc: gcc, cxx: g++, type: Debug}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++, type: Release}
    runs-on: ${{ matrix.os }}
    env: {CC: '${{ matrix.cc }}', CXX: '${{ matrix.cxx }}'}
    steps:
      - uses: actions/checkout@v4
      - name: codec libraries (build + test the transposer too)
        run: sudo apt-get -qq update && sudo apt-get -qq install -y liblzma-dev libzstd-dev liblz4-dev zlib1g-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DUCACHE_BUILD_BENCH=OFF -DUCACHE_BUILD_PLUGIN=OFF
      - run: cmake --build build -j"$(nproc)"
      - name: unit + differential (1e5 ops)
        run: cd build && ctest --output-on-failure -E crash-suite

  build-alma9:
    runs-on: ubuntu-24.04
    container: almalinux:9
    steps:
      - name: deps
        run: |
          dnf -y install epel-release
          dnf -y install gcc-c++ cmake make git xrootd-client-devel xrootd-client xrootd-server \
                         xz-devel libzstd-devel lz4-devel zlib-devel
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUCACHE_BUILD_BENCH=OFF
             -DUCACHE_XROOTD_ROOT=/usr
      - run: cmake --build build -j"$(nproc)"
      - run: cd build && ctest --output-on-failure -E crash-suite
      - name: plugin fuzz vs local origin (1e5 + 8-thread)
        run: |
          mkdir -p /bench/data && dd if=/dev/urandom of=/bench/data/f.bin bs=1M count=64
          # xrootd refuses uid 0: the container runs as root, so drop privileges
          useradd -m xrdsrv && chmod -R a+rX /bench/data
          runuser -u xrdsrv -- xrootd -b -p 10940 -l /tmp/xrootd-origin.log /bench/data
          mkdir -p /tmp/conf /tmp/cache
          printf 'url = 127.0.0.1:10940\nlib = %s\nenable = true\n' "$PWD/build/src/plugin/libXrdClUCache.so" > /tmp/conf/u.conf
          XRD_PLUGINCONFDIR=/tmp/conf UCACHE_DIR=/tmp/cache ./build/tests/ucache-plugin-fuzz root://127.0.0.1:10940//bench/data/f.bin /bench/data/f.bin 100000 1 1
          XRD_PLUGINCONFDIR=/tmp/conf UCACHE_DIR=/tmp/cache ./build/tests/ucache-plugin-fuzz root://127.0.0.1:10940//bench/data/f.bin /bench/data/f.bin 100000 8 2
      - name: a basket the origin serves as zeros fails the key-position check
        run: |
          # Jet_pt basket 1 of the fixture (2481 bytes at 4915) lies wholly in the
          # last page of the basket before it, a page that holds none of the
          # file's records. The origin serves a copy with that basket zeroed.
          cp tests/data/unnamed_codec_fixture.root /bench/data/zeroed.root
          dd if=/dev/zero of=/bench/data/zeroed.root bs=64K seek=4915 count=2481 \
             oflag=seek_bytes iflag=count_bytes conv=notrunc status=none
          chmod a+r /bench/data/zeroed.root
          # A cache of its own: the mode needs one that holds none of the file.
          mkdir -p /tmp/cache-keycheck
          XRD_PLUGINCONFDIR=/tmp/conf UCACHE_DIR=/tmp/cache-keycheck UCACHE_CHECK_ORIGIN_INTEGRITY=on \
            ./build/tests/ucache-plugin-fuzz root://127.0.0.1:10940//bench/data/zeroed.root \
            tests/data/unnamed_codec_fixture.root 0 1 0 key-check 4915 2481
      - name: copies through the plugin are the origin's bytes (copy engine vs a reader, one process)
        run: |
          # A cache of its own: the probe needs one that does not hold the file yet.
          mkdir -p /tmp/cache-copy
          XRD_PLUGINCONFDIR=/tmp/conf UCACHE_DIR=/tmp/cache-copy ./build/tests/ucache-copy-probe root://127.0.0.1:10940//bench/data/f.bin /bench/data/f.bin
      - name: the cache's own origin open keeps the reader's tried=
        run: |
          # A cache of its own: the first open must find the file uncached.
          mkdir -p /tmp/cache-tried
          XRD_PLUGINCONFDIR=/tmp/conf UCACHE_DIR=/tmp/cache-tried ./build/tests/ucache-tried-probe root://127.0.0.1:10940//bench/data/f.bin
      - name: retries replacing a handle's origin file while other threads call into it
        run: |
          # A refused connection must fail at once, not after the client's 120 s window.
          export XRD_CONNECTIONWINDOW=3 XRD_CONNECTIONRETRY=1 XRD_PLUGINCONFDIR=/tmp/conf
          F=/bench/data/f.bin; U=root://127.0.0.1:10940/$F
          # The cache's own open, then the reader's; each mode stops a hung run itself.
          mkdir -p /tmp/cache-ir1 /tmp/cache-ir2
          UCACHE_DIR=/tmp/cache-ir1 UCACHE_OPEN_RETRIES=3 UCACHE_TEST_OPEN_FAIL_N=3 UCACHE_OPEN_RETRY_BASE_MS=1 \
            ./build/tests/ucache-plugin-fuzz "$U" $F 20 4 0 inner-race
          UCACHE_DIR=/tmp/cache-ir2 UCACHE_REVALIDATE_S=0 UCACHE_OPEN_RETRIES=3 UCACHE_TEST_OPEN_FAIL_N=3 \
            UCACHE_OPEN_RETRY_BASE_MS=5 ./build/tests/ucache-plugin-fuzz "$U" $F 20 4 0 inner-race-relay
          # The fault was felt: 3 retried attempts per open (the first mode's
          # setup open too), as the cache's own counter has it.
          retries() { cat "$1"/stats/*.jsonl | grep -v '"key"' | grep -o '"open_retries":[0-9]*' | grep -o '[0-9]*$' | sort -n | tail -1; }
          r1=$(retries /tmp/cache-ir1); r2=$(retries /tmp/cache-ir2)
          echo "open_retries: $r1 and $r2"
          [ "${r1:-0}" -ge 63 ] && [ "${r2:-0}" -ge 60 ]
      - name: an open the client refuses at once reaches the reader through its handler
        run: |
          # Two opens to a refused port in one process: the second falls inside
          # the client's error window and is refused before it is sent. Then the
          # same through the retrying handler, both attempts refused.
          export XRD_CONNECTIONWINDOW=3 XRD_CONNECTIONRETRY=1 XRD_PLUGINCONFDIR=/tmp/conf
          export UCACHE_REVALIDATE_S=0 XRD_LOGLEVEL=Debug
          F=/bench/data/f.bin; U=root://127.0.0.1:10940/$F
          mkdir -p /tmp/cache-or /tmp/cache-or2
          XRD_LOGFILE=/tmp/or.log UCACHE_DIR=/tmp/cache-or UCACHE_TEST_OPEN_FAIL_N=1 UCACHE_OPEN_RETRIES=0 \
            ./build/tests/ucache-plugin-fuzz "$U" $F 1 1 1 open-refused
          XRD_LOGFILE=/tmp/or2.log UCACHE_DIR=/tmp/cache-or2 UCACHE_TEST_OPEN_FAIL_N=2 UCACHE_OPEN_RETRIES=1 \
            UCACHE_OPEN_RETRY_BASE_MS=1 ./build/tests/ucache-plugin-fuzz "$U" $F 1 1 1 open-refused
          # The refusals happened: without them each open fails through the
          # client's own handler, and the mode would pass without testing anything.
          n1=$(grep -c '\[127.0.0.1:1\] Unable to send the message kXR_open' /tmp/or.log)
          n2=$(grep -c '\[127.0.0.1:1\] Unable to send the message kXR_open' /tmp/or2.log)
          echo "opens refused at once: $n1 and $n2"
          [ "$n1" = 1 ] && [ "$n2" = 3 ]
      - name: a property the reader sets while its open is retried reaches the new file
        run: |
          # The first attempt goes to a refused port and is retried after a
          # second; ReadRecovery, set right after Open returns, must still read
          # false once the retry has opened the file.
          export XRD_CONNECTIONRETRY=1 XRD_PLUGINCONFDIR=/tmp/conf XRD_LOGLEVEL=Debug
          F=/bench/data/f.bin; U=root://127.0.0.1:10940/$F
          mkdir -p /tmp/cache-op
          XRD_LOGFILE=/tmp/op.log UCACHE_DIR=/tmp/cache-op UCACHE_ADAPTIVE_FEDERATION=on \
            UCACHE_REVALIDATE_S=0 UCACHE_OPEN_RETRIES=1 UCACHE_TEST_OPEN_FAIL_N=1 \
            UCACHE_OPEN_RETRY_BASE_MS=1000 ./build/tests/ucache-plugin-fuzz "$U" $F 1 1 1 open-property
          # The first attempt went to the refused port: without it the mode
          # would pass without testing anything.
          n=$(grep '\[127.0.0.1:1\] MsgHandler created' /tmp/op.log | grep -c 'kXR_open (file:')
          echo "first attempts at the refused port: $n"
          [ "$n" -ge 1 ]

  # macOS: keep the tree compiling under AppleClang and run the hermetic tests.
  # Build-and-test only, deliberately: reading root:// through the plugin needs a
  # real client stack and a real origin, and is validated on hardware instead.
  # The `bench` storage self-test does not exist here (see src/cli/CMakeLists.txt).
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: codec libraries (build + test the transposer too)
        run: brew install xz zstd lz4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUCACHE_BUILD_BENCH=OFF
             -DUCACHE_BUILD_PLUGIN=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix)"
        # -k: keep going after the first error. A porting round learns whatever the
        # compiler can tell it in ONE run; stopping at the first file turns a list
        # of diagnostics into one-per-push, which is how this leg spent three
        # rounds discovering three unrelated missing declarations.
      - run: cmake --build build -j"$(sysctl -n hw.ncpu)" -- -k
      - name: unit + differential (1e5 ops)
        run: cd build && ctest --output-on-failure -E crash-suite
      - name: the hardware CRC32C path must be the one compiled in
        run: |
          # A green suite cannot distinguish "hardware path verified" from
          # "hardware path absent": the agreement test SKIPS when no hardware
          # implementation is compiled in, and a skip counts as a pass. Absent
          # means every cached page is checksummed by the software table — on
          # the read path this cache exists to make fast, and invisibly.
          out=$(./build/tests/ucache-unit-tests --gtest_filter='Crc32c.*' 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -E "SKIPPED|PASSED|FAILED" || true
          if echo "$out" | grep -q "SKIPPED"; then
            echo "::error::no hardware CRC32C for this target — the checksum on every cached page would use the software table"
            exit 1
          fi
      - name: the storage self-test must RUN here, not merely compile
        run: |
          # Compiling this file on macOS is not the same as exercising it, and
          # the difference has already cost something: the port shipped with no
          # per-device figures at all, because the counter reader returned
          # nothing and no CI leg ever looked at its output. This is a smoke
          # test, not a measurement — seconds of IO on a runner's shared disk
          # says nothing about a device, and it is not logged anywhere.
          #
          # What it does check is that the Darwin-only paths execute: cache
          # bypass via F_NOCACHE (there is no O_DIRECT here), filesystem naming
          # through statfs, and the IOKit registry walk that reads the
          # per-device counters — which retains and releases kernel objects and
          # traverses a storage topology that differs between machines.
          out=$(./build/src/cli/ucache bench --size 64m --measurement-duration 0.2 \
                  --threads 2 --no-log . 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          # The mode must be named, and on this platform it must be the hint
          # rather than a guarantee -- if this ever reads O_DIRECT the reported
          # methodology is wrong for the platform.
          echo "$out" | grep -q "F_NOCACHE" || {
            echo "::error::the self-test did not report F_NOCACHE as its cache-bypass mode"; exit 1; }
          # A JSON record, and one that names this platform's kernel.
          echo "$out" | grep -q '^ucache-bench-json: {' || {
            echo "::error::no ucache-bench-json record emitted"; exit 1; }
          # Device counters: absent ones read as zero, which is the state this
          # leg exists to prevent regressing to.
          echo "$out" | grep -qE '"mount_source":"[^"]+"' || {
            echo "::error::the record names no device -- statfs resolution failed"; exit 1; }

      - name: plugin, when an XRootD client is installable
        run: |
          # Not a required leg: the point of the job is the compiler, and the core
          # plus CLI above already exercise most of it. If the formula is missing
          # or broken the plugin's own warnings simply go unchecked here, which is
          # worth saying out loud rather than failing the build over.
          if ! brew install xrootd; then
            echo "::warning::no installable xrootd — plugin compile not checked on macOS"
            exit 0
          fi
          # The plugin builds for XRootD 5 and 6 alike: whichever major the
          # formula ships is compiled here, so a macOS-only break in the plugin
          # shows before a release tag, not in the release job.
          ver=$(brew list --versions xrootd | awk '{print $NF}')
          case "$ver" in
            5.*|6.*) ;;
            *) echo "::warning::Homebrew xrootd is $ver; neither major the plugin builds for — plugin compile skipped"
               exit 0 ;;
          esac
          cmake -S . -B build-plugin -DCMAKE_BUILD_TYPE=Release -DUCACHE_BUILD_BENCH=OFF \
                -DUCACHE_BUILD_TESTS=OFF -DUCACHE_XROOTD_ROOT="$(brew --prefix)" \
                -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build-plugin -j"$(sysctl -n hw.ncpu)" -- -k

  # Zero-admin acceptance: install -> `ucache setup` (no root) ->
  # new-shell cached read (warm origin=0) -> fail-open, all in a CLEAN container
  # (no CVMFS/LCG). Alma9 gates it; Ubuntu is best-effort (needs xrootd-dev >=5.6).
  zero-admin-install:
    runs-on: ubuntu-24.04
    container: almalinux:9
    steps:
      - uses: actions/checkout@v4
      - name: clean-install zero-admin gate
        run: bash scripts/clean-install-gate.sh "$PWD"

  sanitizers:
    strategy:
      matrix:
        sanitize: ['address,undefined', 'thread']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUCACHE_BUILD_BENCH=OFF
             -DUCACHE_BUILD_PLUGIN=OFF -DUCACHE_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build build -j"$(nproc)"
      - run: cd build && ctest --output-on-failure -E crash-suite
      - name: crash suite under sanitizer (30 iters)
        run: UCACHE_CRASH_ITERS=30 ./build/tests/ucache-crash-harness
      - name: record file crash suite under sanitizer (30 iters)
        run: UCACHE_CRASH_ITERS=30 ./build/tests/ucache-crash-harness records

  coverage-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install gcovr
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUCACHE_BUILD_BENCH=OFF -DUCACHE_BUILD_PLUGIN=OFF -DUCACHE_COVERAGE=ON
      - run: cmake --build build -j"$(nproc)"
      - run: UCACHE_TEST_OPS=50000 ./build/tests/ucache-unit-tests
      - name: gate >= 85% on src/core
        run: gcovr --root . --filter 'src/core/' --exclude 'src/core/testing/'
             --gcov-ignore-parse-errors=negative_hits.warn
             --gcov-ignore-errors=no_working_dir_found
             --fail-under-line 85 build --txt

  crash-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUCACHE_BUILD_BENCH=OFF -DUCACHE_BUILD_PLUGIN=OFF
      - run: cmake --build build -j"$(nproc)"
      - name: 200 kill -9 iterations
        run: UCACHE_CRASH_ITERS=200 ./build/tests/ucache-crash-harness
      - name: 200 kill -9 iterations of the record file (torn lines, older readers)
        run: UCACHE_CRASH_ITERS=200 ./build/tests/ucache-crash-harness records

  nightly-long:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUCACHE_BUILD_BENCH=OFF -DUCACHE_BUILD_PLUGIN=OFF
      - run: cmake --build build -j"$(nproc)"
      - name: long differential (1e6 ops) + long crash loop (1000)
        run: |
          UCACHE_TEST_OPS=1000000 ./build/tests/ucache-unit-tests --gtest_filter='Differential.*'
          UCACHE_CRASH_ITERS=1000 ./build/tests/ucache-crash-harness
          UCACHE_CRASH_ITERS=1000 ./build/tests/ucache-crash-harness records
